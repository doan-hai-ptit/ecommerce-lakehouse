networks:
  monitor-net:
    driver: bridge

services:
  prometheus:
    image: prom/prometheus:v2.51.1
    container_name: prometheus
    user: "0"
    volumes:
      # Định cấu hình file config từ thư mục hiện tại
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Lưu trữ toàn bộ dữ liệu Prometheus ra ổ đĩa ngoài của bạn
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitor-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    # Khi dùng bind mount với Grafana, cần chạy với quyền root 
    # để tránh lỗi không có quyền ghi (Permission denied) vào thư mục ổ đĩa ngoài
    user: "0"
    volumes:
      # Lưu trữ toàn bộ dashboard, user, cấu hình Grafana ra ổ đĩa ngoài
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3100:3000"
    networks:
      - monitor-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.0
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - monitor-net
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
