  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive_metastore
    ports:
      - "9083:9083"
    environment:
      - SERVICE_NAME=metastore
      - DB_DRIVER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=postgres_metastore
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - IS_RESUME=true
      - HADOOP_CLASSPATH=/opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.1.0.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.11.271.jar
      - SERVICE_OPTS=-Dhive.metastore.schema.verification=false -Ddatanucleus.schema.autoCreateTables=true -Ddatanucleus.schema.autoCreateAll=true
    volumes:
      - ./processing/hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./postgresql-42.6.0.jar:/opt/hive/lib/postgresql-9.4.1208.jre7.jar
    depends_on:
      - postgres

