services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      # - "/media/doanhai/New Volume/Volumes/minio_storage:/data"
      - minio_storage:/data
    command: server /data --console-address ":9001"
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_server
    user: root
    ports:
      - 9092:9092
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
      # - "/media/doanhai/New Volume/Volumes/kafka_data:/var/lib/kafka/data"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka_ui
    ports:
      - 8080:8080
    depends_on:
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=CDC_Cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - DYNAMIC_CONFIG_ENABLED=true

  # mysql:
  #   image: mysql:8.0
  #   container_name: mysql_source
  #   ports:
  #     - 3306:3306
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=root_pass
  #     - MYSQL_DATABASE=inventory
  #     - MYSQL_USER=user
  #     - MYSQL_PASSWORD=user_pass
  #   command: 
  #     - --server-id=1 
  #     - --log-bin=mysql-bin 
  #     - --binlog-format=row 
  #     - --binlog-row-image=full
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #     - "/media/doanhai/New Volume/Volumes/mysql_data:/var/lib/mysql"
  postgres:
    image: postgres:16-alpine
    container_name: postgres_metastore
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres_metastore
    volumes:
      # - "/media/doanhai/New Volume/Volumes/postgres_metastore_data:/var/lib/postgresql/data"
      - postgres_metastore_data:/var/lib/postgresql/data
  spark-processor:
    build: ./processing/
    container_name: spark_processor
    depends_on:
      - minio
      - postgres
      - kafka
    ports:
      - "4040:4040"
    env_file:
      - ./processing/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_BRONZE_PATH=s3a://bronze-lakehouse/kafka_cdc
    volumes:
      - ./processing:/app
      - ./processing/hive-site.xml:/opt/spark/conf/hive-site.xml
    # Sử dụng network mode host nếu MinIO của bạn đang chạy ngoài Docker
    # Hoặc bỏ dòng này nếu MinIO cũng nằm trong Docker Compose này
    # network_mode: "host" 
    tty: true
  browserless:
    image: browserless/chrome:latest
    container_name: browserless_chrome
    ports:
      - "3000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - DEMO_MODE=false
    # restart: always
  postgres-data-source:
    image: postgres:16-alpine
    container_name: postgres-data-source
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=data-source
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      # - "/media/doanhai/New Volume/Volumes/postgres-data-source:/var/lib/postgresql/data"
      - postgres-data-source:/var/lib/postgresql/data
  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: debezium_connect
    ports:
      - 8083:8083
    depends_on:
      - kafka
      - postgres-data-source
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=cdc.ecommerce.connect.configs
      - OFFSET_STORAGE_TOPIC=cdc.ecommerce.connect.offsets
      - STATUS_STORAGE_TOPIC=cdc.ecommerce.connect.statuses
      - CONFIG_STORAGE_REPLICATION_FACTOR=1
      - OFFSET_STORAGE_REPLICATION_FACTOR=1
      - STATUS_STORAGE_REPLICATION_FACTOR=1
      - KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - CONNECT_PLUGIN_PATH=/kafka/connect,/kafka/custom-connect
    # volumes:
    #   Dùng named volume này nếu sau này bạn cần cài thêm plugin ngoài cho Debezium
    #   - debezium_plugins:/kafka/connect
    #   - "/media/doanhai/New Volume/Volumes/debezium_plugins:/kafka/custom-connect"

volumes:
  minio_storage:
  postgres_metastore_data:
  postgres-data-source:
  # kafka_data:               # Volume mặc định cho Kafka
  # mysql_data:               # Volume mặc định cho MySQL
