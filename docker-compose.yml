  pandas-processor:
    build:
      context: .
      dockerfile: processing/Dockerfile.pandas
    image: doanhai2005/pandas-processor:1.3
    container_name: pandas_processor
    depends_on:
      - minio
      - postgres
      # - kafka
    env_file:
      - ./processing/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_BRONZE_PATH=s3a://bronze-lakehouse/kafka_cdc
    volumes:
      - ./processing:/app
    tty: true
  browserless:
    image: browserless/chrome:latest
    container_name: browserless_chrome
    ports:
      - "3000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - DEMO_MODE=false
