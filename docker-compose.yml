  postgres:
    image: postgres:16-alpine
    container_name: postgres_metastore
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres_metastore
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - "/path/to/volumes/postgres_metastore_data:/var/lib/postgresql/data"
      # - postgres_metastore_data:/var/lib/postgresql/data
